name: Verify Foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: primal
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: primal_crown
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primal -d primal_crown"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://primal:test-only-password@127.0.0.1:5432/primal_crown
      INTERNAL_API_TOKEN: ci-long-random-placeholder-token-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test
      - name: Migrate database
        run: npm run db:migrate
      - name: API integration smoke test
        run: node tests/api-smoke.mjs
